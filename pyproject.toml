[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdbc-pipeline"
version = "1.0.0"
description = "Leakage-resistant repeated nested validation pipeline for the WDBC breast-cancer dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WDBC pipeline maintainers" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.4",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
]

[project.optional-dependencies]
explain = ["shap>=0.45", "lime>=0.2.0.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]
all = ["wdbc-pipeline[explain,dev]"]

[project.scripts]
wdbc-pipeline = "wdbc_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wdbc_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: end-to-end tests that fit real models (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
# PD010: .pivot is deliberate (raises on duplicate keys instead of silently aggregating)
ignore = ["RUF001", "RUF002", "RUF003", "E501", "B905", "PD010", "SIM113", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
